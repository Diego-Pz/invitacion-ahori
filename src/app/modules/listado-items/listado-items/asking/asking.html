<div class="fondoCarta">
    <img class="w-3/5" src="assets/png/ask.png" alt="Descripción">
    <div class="text-wrapper" [class.active]="activo">
        <span class="text text1">バレンタインを一緒に過ごしてくれる?</span>
        <span class="text text2">¿Quieres ser mi San Valentín?</span>
    </div>
    <button class="botonApariencia botonAccion" (click)="activo = !activo">
        {{activo ? 'Volver a Japonés' : '¿Nitas traducción? Presiona aquí'}}
    </button>
    <div class="flex flex-row gap-5 items-center mt-10">
        <button class="botonApariencia botonCancelar !text-[24px]" [ngClass]="tamanioBoton === 0 ? 'scale-100' : (tamanioBoton === 1 ? 'scale-[0.5]' : 'scale-[0.25]')" (click)="close()" *ngIf="tamanioBoton < 3">
            No (いいえ)
        </button>
        <button class="botonApariencia botonAccion !text-[24px]" (click)="yes()">
            Sí (はい)
        </button>
    </div>
</div>
